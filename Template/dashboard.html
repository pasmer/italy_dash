{% extends "Template/base.html" %}

{% block title %}Dashboard - Italy Dash{% endblock %}

{% block content %}
<!-- Top Navigation Header -->
<header class="sticky top-0 z-50 w-full backdrop-blur-md bg-white/90 dark:bg-background-dark/90 border-b border-slate-200 dark:border-slate-800/50">
    <div class="flex items-center justify-between px-5 py-3 w-full">
        <!-- Hamburger Button (Mobile only) -->
        <button id="mobile-menu-btn" class="md:hidden mr-3 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 p-2 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-primary/50">
            <span class="material-symbols-outlined text-2xl">menu</span>
        </button>

        <div class="flex items-center gap-2 cursor-pointer group" onclick="window.location.href='/'">
            <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-primary/10 text-primary group-hover:bg-primary group-hover:text-white transition-colors">
                <span class="material-symbols-outlined text-xl">analytics</span>
            </div>
            <h1 class="text-base font-bold tracking-tight text-slate-900 dark:text-white">Italy <span class="font-normal text-slate-500">Dashboard</span></h1>
        </div>
    </div>
</header>

<!-- Main Content Area with iframe -->
<!-- We use h-[calc(100vh-60px)] to ensure it takes up exactly the rest of the height below the header, assuming header is ~60px tall -->
<main class="w-full flex-grow relative" style="height: calc(100vh - 61px);">
    <iframe id="shiny-iframe" class="w-full h-full border-0 absolute inset-0" src="/content"></iframe>

</main>
{% endblock %}
