run_as shiny;

# Route Docker logs to stderr so `docker logs` captures them
preserve_logs true;

server {
  listen 3838;

  location / {
    app_dir /srv/shiny-server/italy_dash;
    log_dir /var/log/shiny-server;

    # Never idle-kill the app (keeps reactive file readers alive)
    app_idle_timeout 0;

    # Allow 2 min for startup: R load + 4 GitHub CSV fetches
    app_init_timeout 120;
  }
}
